      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - user_message
        text:
          type: string
        user_identifier:
          type: string
        source_medium:
          $ref: '#/components/schemas/UserMessageSourceMedium'
      title: UserMessage
    UserActivity:
      type: object
      properties:
        type:
          type: string
          enum:
            - user_activity
      title: UserActivity
    MultimodalMessageTextSourceMedium:
      type: string
      enum:
        - audio
        - dtmf
        - text
        - image
        - file
      title: MultimodalMessageTextSourceMedium
    MultimodalMessageText:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - user_message
          default: user_message
        text:
          type: string
        user_identifier:
          type: string
        source_medium:
          $ref: '#/components/schemas/MultimodalMessageTextSourceMedium'
      title: MultimodalMessageText
    MultimodalMessageFile:
      type: object
      properties:
        type:
          type: string
          enum:
            - file_input
          default: file_input
        file_id:
          type: string
      required:
        - file_id
      description: >-
        Deprecated: single attachment, kept for clients that predate `files`.
        Ignored when `files` is set.
      title: MultimodalMessageFile
    MultimodalMessageFilesItems:
      type: object
      properties:
        type:
          type: string
          enum:
            - file_input
          default: file_input
        file_id:
          type: string
      required:
        - file_id
      title: MultimodalMessageFilesItems
    MultimodalMessage:
      type: object
      properties:
        type:
          type: string
          enum:
            - multimodal_message
        text:
          $ref: '#/components/schemas/MultimodalMessageText'
        file:
          $ref: '#/components/schemas/MultimodalMessageFile'
          description: >-
            Deprecated: single attachment, kept for clients that predate
            `files`. Ignored when `files` is set.
        files:
          type: array
          items:
            $ref: '#/components/schemas/MultimodalMessageFilesItems'
          description: >-
            Files attached to this message, at most 5. Each file must already
            have been uploaded via the conversation file upload endpoint.
      title: MultimodalMessage
    Pong:
      type: object
      properties:
        type:
          type: string
          enum:
            - pong
        event_id:
          type: integer
          description: ID of the ping event this pong responds to.
      required:
        - event_id
      title: Pong
    ClientToolResultErrorType:
      type: string
      enum:
        - user_rejected
        - external_server
        - external_client
        - customer_auth
        - client_timeout
        - unknown
      description: >-
        Optional category for the failure reason. When set, `is_error` is
        treated as true. `user_rejected` is special-cased to mark the tool as
        not having been called.
      title: ClientToolResultErrorType
    ClientToolResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - client_tool_result
        tool_call_id:
          type: string
          description: ID of the tool call this result corresponds to.
        result:
          type: string
        is_error:
          type: boolean
        error_type:
          $ref: '#/components/schemas/ClientToolResultErrorType'
          description: >-
            Optional category for the failure reason. When set, `is_error` is
            treated as true. `user_rejected` is special-cased to mark the tool
            as not having been called.
      required:
        - tool_call_id
        - result
        - is_error
      title: ClientToolResult
    McpToolApprovalResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - mcp_tool_approval_result
        tool_call_id:
          type: string
          description: The ID of the tool call this approval responds to.
        is_approved:
          type: boolean
          description: Whether the user approved the tool call.
      required:
        - tool_call_id
        - is_approved
      title: McpToolApprovalResult
    ContextualUpdate:
      type: object
      properties:
        type:
          type: string
          enum:
            - contextual_update
        text:
          type: string
          description: Context text to inject into the conversation without interrupting.
        context_id:
          type: string
          description: >-
            Optional client-supplied identifier. When a newer update with the
            same context_id arrives, the older one supersedes it: the older
            update is dropped from the LLM view and visually marked as
            superseded in the rendered transcript.
      required:
        - text
      title: ContextualUpdate
    ConversationInitiationClientDataConversationConfigOverrideAsr:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
          description: Keywords to boost prediction probability for
      description: Configuration for conversational transcription
      title: ConversationInitiationClientDataConversationConfigOverrideAsr
    ConversationInitiationClientDataConversationConfigOverrideTurnSoftTimeoutConfig:
      type: object
      properties:
        message:
          type: string
          description: >-
            Message to show when the first soft timeout is reached while waiting
            for LLM response. Supports dynamic variables (e.g.,
            {{system__time}}, {{custom_variable}}).
        additional_soft_timeout_messages:
          type: array
          items:
            type: string
          description: >-
            Extra static filler messages for subsequent soft timeouts in the
            same LLM generation. The first timeout uses `message`. If fewer
            messages are configured than `max_soft_timeouts_per_generation`, the
            last configured message is repeated; otherwise a built-in filler is
            used.
      description: >-
        Configuration for soft timeout functionality. Provides immediate
        feedback during longer LLM responses.
      title: >-
        ConversationInitiationClientDataConversationConfigOverrideTurnSoftTimeoutConfig
    ConversationInitiationClientDataConversationConfigOverrideTurn:
      type: object
      properties:
        soft_timeout_config:
          $ref: >-
            #/components/schemas/ConversationInitiationClientDataConversationConfigOverrideTurnSoftTimeoutConfig
          description: >-
            Configuration for soft timeout functionality. Provides immediate
            feedback during longer LLM responses.
      description: Configuration for turn detection
      title: ConversationInitiationClientDataConversationConfigOverrideTurn
