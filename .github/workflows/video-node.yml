name: Local video node

# Same trust policy as ci.yml: push to main and manual dispatch only, on the project's
# self-hosted Mac. GitHub-hosted runners are not available to this account, and a
# `pull_request` trigger on a self-hosted runner would let any fork run code on it.
# The contract tests use temporary directories and fake renderers; python3 is the
# runner's own interpreter.
on:
  push:
    branches: [main]
    paths:
      - 'Resources/video-node/**'
      - '.github/workflows/video-node.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # v4.2.2; pin the immutable commit, not the mutable major-version tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record the interpreter
        run: python3 --version
      - name: Test the adapter and installer
        run: python3 -m unittest discover -s Resources/video-node -p 'test_*.py' -v
      - name: Test the batch and gallery example
        run: python3 -m unittest discover -s Resources/video-node/examples -p 'test_*.py' -v
