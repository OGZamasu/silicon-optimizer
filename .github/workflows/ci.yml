name: CI

# Push to main only, deliberately.
#
# This runs on a self-hosted runner — a real Mac. Adding `pull_request` to a public repository
# would let anyone on the internet execute arbitrary code on that machine simply by opening a
# pull request, with access to whatever the runner's user can reach. Only people with write
# access can push, so this trigger is the safe one.
#
# To validate pull requests, use a GitHub-hosted runner for that job, or turn on
# "Require approval for all external contributors" and accept that every PR needs a click.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Self-hosted, on real Apple Silicon. The hardware probes read actual sysctls and the
    # IORegistry, so the detection tests are meaningful here in a way they would not be on a
    # generic cloud runner — and GitHub-hosted minutes are not consumed at all.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner uses whatever toolchain the machine already has, so there is
      # nothing to select — just record it, because "works on my Mac" is exactly the failure
      # mode this job exists to catch.
      - name: Record the toolchain
        run: |
          swift --version
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string

      - name: Build
        run: swift build --configuration release

      - name: Test
        run: swift test

      - name: Verify the MCP bridge speaks the protocol
        run: Scripts/verify-mcp.sh --configuration release

      - name: Assemble the app bundle
        run: Scripts/build-app.sh --release

      - name: Verify the bundle
        run: |
          # A bundle that cannot be signed or launched is a broken release; catch it here
          # rather than in someone's Downloads folder.
          codesign --verify --deep --strict "build/Silicon Optimizer.app"
          test -x "build/Silicon Optimizer.app/Contents/MacOS/SiliconOptimizer"

      - name: Validate the catalog against Hugging Face
        # Depends on repositories this project does not control, so a rename upstream should
        # be visible here without failing the build.
        continue-on-error: true
        env:
          SILICON_NETWORK_TESTS: "1"
        run: swift test --filter CatalogIntegration

      - uses: actions/upload-artifact@v4
        with:
          name: Silicon-Optimizer-app
          path: build/Silicon Optimizer.app
