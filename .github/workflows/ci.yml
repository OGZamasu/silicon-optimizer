name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Apple Silicon runner. The hardware probes read real Apple Silicon sysctls and the
    # IORegistry, so the detection tests would fail on an Intel runner.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Pick the newest Xcode the image has rather than pinning an exact version — the
      # runner images rename these regularly, and a stale path fails the whole job.
      - name: Select the newest Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          swift --version

      - name: Build
        run: swift build --configuration release

      - name: Test
        run: swift test

      - name: Verify the MCP bridge speaks the protocol
        run: Scripts/verify-mcp.sh --configuration release

      - name: Assemble the app bundle
        run: Scripts/build-app.sh --release

      - name: Verify the bundle
        run: |
          # A bundle that cannot be signed or launched is a broken release; catch it here
          # rather than in someone's Downloads folder.
          codesign --verify --deep --strict "build/Silicon Optimizer.app"
          test -x "build/Silicon Optimizer.app/Contents/MacOS/SiliconOptimizer"

      - name: Validate the catalog against Hugging Face
        # Depends on repositories this project does not control, so a rename upstream should
        # be visible here without failing the build.
        continue-on-error: true
        env:
          SILICON_NETWORK_TESTS: "1"
        run: swift test --filter CatalogIntegration

      - uses: actions/upload-artifact@v4
        with:
          name: Silicon-Optimizer-app
          path: build/Silicon Optimizer.app
